services:
  viewer:
    image: localhost/overture-explorer-airgap:local
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${VIEWER_PORT:-8088}:8080"
    volumes:
      - ./airgap-output/catalog:/usr/share/nginx/html/catalog:ro
      - ./airgap-output/tiles:/usr/share/nginx/html/tiles:ro
      - ./airgap-output/data:/usr/share/nginx/html/data:ro
      - ./public/config/viewer-config.json:/usr/share/nginx/html/config/viewer-config.json:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  tiles-smoke-places:
    image: localhost/overture-tiles-airgap:local
    profiles: ["generate"]
    environment:
      RELEASE: "2026-04-15.0"
      THEME: "places"
      BBOX: "${BBOX:-}"
      SOURCE_PATH: "/input/release"
      OUTPUT: "/output"
      PRESERVE_PARQUET: "true"
    volumes:
      - ${OVERTURE_RELEASE_DIR:-./data/release/2026-04-15.0}:/input/release:ro
      - ./airgap-output:/output
