services:
  viewer:
    image: localhost/overture-explorer-airgap:local
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${VIEWER_PORT:-8088}:8080"
    volumes:
      - ./airgap-output/catalog:/usr/share/nginx/html/catalog:ro
      - ./airgap-output/data:/usr/share/nginx/html/data:ro
      - ./public/config/viewer-config.json:/usr/share/nginx/html/config/viewer-config.json:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  tiles-generator:
    logging:
      driver: none
    image: localhost/overture-tiles-airgap:local
    profiles: ["generate"]
    environment:
      RELEASE: "${OVERTURE_RELEASE:-2026-04-15.0}"
      THEMES: "${THEMES:-base,buildings,places,divisions,transportation,addresses}"
      BBOX: "${BBOX:-}"
      SOURCE_PATH: "/input/release"
      PMTILES_S3_PATH: "${PMTILES_S3_PATH:?Set PMTILES_S3_PATH to the generated release S3 URI}"
      PMTILES_SCRATCH_ROOT: /scratch
      PMTILES_MIN_FREE_GB: "${PMTILES_MIN_FREE_GB:?Set PMTILES_MIN_FREE_GB}"
      PMTILES_MAX_SCRATCH_GB: "${PMTILES_MAX_SCRATCH_GB:-}"
      PMTILES_MAX_LOCAL_GB: "${PMTILES_MAX_LOCAL_GB:-}"
      PLANETILER_THREADS: "${PLANETILER_THREADS:-12}"
      PLANETILER_SORT_MAX_READERS: "${PLANETILER_SORT_MAX_READERS:-1}"
      PLANETILER_SORT_MAX_WRITERS: "${PLANETILER_SORT_MAX_WRITERS:-1}"
      GENERATOR_IMAGE_ID: "${GENERATOR_IMAGE_ID:-not-provided}"
      OUTPUT: "/output"
      PRESERVE_PARQUET: "${PRESERVE_PARQUET:-false}"
      PLANETILER_COMPRESS_TEMP: "${PLANETILER_COMPRESS_TEMP:-true}"
      PLANETILER_MMAP_TEMP: "${PLANETILER_MMAP_TEMP:-false}"
      S3_REGION: "${S3_REGION:?Set S3_REGION}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}"
      AWS_REGION: "${S3_REGION:?Set S3_REGION}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL}"
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ${OVERTURE_RELEASE_DIR:-./data/release/2026-04-15.0}:/input/release:ro
      - ./airgap-output:/output
      - ${PMTILES_SCRATCH_DIR:-./airgap-output/scratch}:/scratch
